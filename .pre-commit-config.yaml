# The fast half of CI, run before every commit:
#   pip install pre-commit && pre-commit install
# Keep the ruff rev in step with requirements/lint.txt.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: oracle-guard
        name: no binaries / oversized files
        entry: python tools/guard.py
        language: system
        pass_filenames: false
        always_run: true
