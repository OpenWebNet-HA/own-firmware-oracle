# Rebuilds the manifests of stale catalog entries and opens a PR with them.
# This one touches firmware, so mind the R2 / environment notes below.
#
# Runners are pinned to ubuntu-24.04, not ubuntu-latest: debugfs (e2fsprogs)
# lists the ext filesystems, and a runner image bump must not silently change
# a manifest that is supposed to re-run to a zero diff.
#
# Secrets live ONLY in a protected `firmware` environment limited to `main`.
# Fork PRs never see them. No pull_request_target. Firmware is fetched to
# $RUNNER_TEMP (outside the repo) and deleted after the job; never cached,
# never an artifact (a fork PR could otherwise restore it from the base-branch
# cache). reproduce.yml is the read-only twin: it re-runs FRESH entries and
# fails if they no longer come out byte for byte.
#
# Three jobs, least privilege each:
#   plan     read-only; lists the stale catalog entries
#   oracle   read-only + firmware secrets; one job per stale entry, uploads
#            ONLY its manifest.tsv as an artifact
#   publish  write token, no secrets, no firmware; collects every manifest
#            and opens ONE pull request (parallel oracle jobs never race for
#            the PR branch)
#
# Injection hygiene: no ${{ }} expression is ever expanded inside a `run:`
# script. Values reach the shell only through `env:` and are always quoted.
# plan.py validates every catalog entry (plain-name product / version /
# filenames, https vendor hosts) before it can reach the matrix. Third-party
# actions are pinned to full commit SHAs.
name: oracle
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly
permissions:
  contents: read
# One run at a time: two overlapping runs would both push oracle/update-results.
concurrency:
  group: oracle
  cancel-in-progress: false
defaults:
  run:
    shell: bash  # -eo pipefail
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/oracle.txt
      # Emit the catalog entries whose (image sha256, tool version) key is not
      # yet reflected in results/. Only out-of-date images get rebuilt.
      - id: plan
        run: python tools/plan.py --emit-matrix >> "$GITHUB_OUTPUT"

  oracle:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: firmware        # protected; only main can read the secrets
    strategy:
      max-parallel: 4
      matrix:
        entry: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/oracle.txt
      - uses: ./.github/actions/extraction-tools  # zizmor: ignore[self-repository] actionlint rejects the $/ form
      # One step, no $GITHUB_ENV hop: the image path never becomes an env
      # assignment, and a failed fetch fails the step (plain assignment, not
      # a substitution inside echo). The manifest is staged under out/ so the
      # artifact holds that one file and nothing else.
      - name: fetch (sha256-verified, cache outside the repo) and unpack -> manifest
        env:
          ENTRY: ${{ matrix.entry }}
          OWN_FW_CACHE: ${{ runner.temp }}/own-fw
        run: |
          img="$(python tools/fwfetch.py "$ENTRY")"
          rel="$(python tools/plan.py --result-path "$ENTRY")"
          python tools/unpack.py "$ENTRY" "$img" -o "out/$rel"
      - name: delete firmware from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/own-fw"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: manifest-${{ strategy.job-index }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, oracle]
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # create-pull-request authenticates with its own token input, so the
      # checkout does not need to leave credentials in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: manifest-*
          merge-multiple: true
          path: incoming
      # Only <product>/<version>/manifest.tsv may come through; anything else
      # in the artifacts fails the job before it can reach the PR.
      - name: accept manifests only
        run: |
          find incoming -type f | while IFS= read -r f; do
            rel="${f#incoming/}"
            if ! printf '%s\n' "$rel" | grep -Eqx '[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*/manifest\.tsv'; then
              echo "unexpected file in artifacts: $rel" >&2
              exit 1
            fi
            mkdir -p "results/$(dirname "$rel")"
            cp "$f" "results/$rel"
          done
          rm -rf incoming
      # guard also checks untracked files, i.e. the manifests just copied in.
      - name: guard
        run: python3 tools/guard.py
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          add-paths: results
          branch: oracle/update-results
          title: "oracle: refresh firmware manifests"
          commit-message: "oracle: refresh firmware manifests"
          body: |
            Rebuilt by the `oracle` workflow for every catalog entry whose
            (image sha256, tool_version) key was not yet in `results/`.
            Only `<product>/<version>/manifest.tsv` files pass the publish job,
            and `tools/guard.py` ran over them. Once merged, `reproduce`
            re-checks these manifests every week.
          delete-branch: true
