# Install as .github/workflows/pr.yml in the own-firmware-oracle repo.
# Shipped as a template (not an active workflow) so it only runs once you
# consciously place it. Runs on every PR, forks included: no secrets, no
# firmware -- lint + guard + unit tests on synthetic fixtures.
name: pr
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml ruff pytest
      - name: lint
        run: ruff check tools tests
      - name: guard (no binaries committed)
        run: python tools/guard.py
      - name: unit tests (synthetic fixtures only)
        run: pytest -q tests
