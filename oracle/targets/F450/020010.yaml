# Oracle target: F450 firmware 2.0.10. Every program is pinned by path and
# sha256 to results/F450/020010/manifest.tsv (oracle/target.py checks it).
product: F450
version: "020010"

sysroot:
  - "F450_020010.fwz!btweb_only.ext3.gz~gunzip:"

bus_device: /dev/ttyS1
bus_framer: line
bus_responder: pic
own_auth: none

programs:
  # supervisor: starts p0..pN of cfg/stack_open.xml <bt_daemon><stackopen>
  bt_daemon:
    path: home/bticino/bin/bt_daemon
    sha256: "85e7ca65b4d1c4e8ab23a93ac532aea568dd06272fefb1b1be928eeba18f3d73"
    role: supervisor

  # p0: the OpenWebNet server daemon (bacclient binds TCP 20000)
  bacclient:
    path: home/bticino/bin/bacclient
    sha256: "e5bd026f22d56f40b697b55d1f0865aed4bbeb2aafbeafc1b1d53e6ca9fe1ec4"
    role: own_server
    port: 20000

  # p1 in stack_open.xml: the BACnet gateway, the firmware's own SOAP web
  # service (urn:bacnet_ws) on TCP 1234 that bacclient reads its points from.
  ebacgw:
    path: home/bticino/bin/ebacgw
    sha256: "b99d2566662f692d949f24f4d0f9c2c9eb5c00f24e90b319a183462155c63ddd"
    role: translator
    port: 1234

  # p3: owns /dev/ttyS1 (stack_open.xml) and serves the translators on TCP 20001
  scsserver:
    path: home/bticino/bin/scsserver
    sha256: "3d928cde18b54800c92e1ec6223db1c26ac31018b0927dcfa0133b0d4173b5af"
    role: bus_server
    port: 20001

  # p2: diagnostics, clock, supervision
  bt_device:
    path: home/bticino/bin/bt_device
    sha256: "7b5d6ca1b8a2170483172340f40097b7474d9ccd8541449d213cf361b4289f67"
    role: translator
    port: 30013

  # p4: thermoregulation
  bt_termo:
    path: home/bticino/bin/bt_termo
    sha256: "963cf11bddd078a8e2ad86c8d98efd0136f1cf83c3c79792064eb834f087cd3d"
    role: translator
    port: 30004

runtime:
  cwd: /home/bticino
  env:
    LD_LIBRARY_PATH: /usr/lib:/home/bticino/lib:/home/bticino/libcoso
  tmpfs:
    - /var/volatile
  dirs:
    - /var/volatile/tmp
    - /var/volatile/tmp/flags
    - /var/volatile/log
    - /var/volatile/tmp/bticino/bt_wd
    - /var/tmp/cfg
    - /var/tmp/db   # ebacgw copies cfg/extra/50/master.sqlite here at start
  links:
    /var/volatile/tmp/stack_open.xml: /home/bticino/cfg/stack_open.xml
    /var/volatile/tmp/conf.xml: /home/bticino/cfg/restore/conf.xml.def
    /var/volatile/tmp/hosts: /home/bticino/cfg/hosts
  files:
    /home/bticino/cfg/hosts: "127.0.0.1\tlocalhost.localdomain\tlocalhost\n127.0.0.1\tbacclient\n127.0.0.1\topenserver\n"
  # The BACnet database ebacgw opens at start (cfg/extra/50/master.sqlite,
  # uploaded by TiOpenBacnet on a real F450). Built from the firmware's own
  # code and factory files, nothing invented -- see findings/F450/
  # bacnet-plant-database.md for the decompiled evidence:
  # - tables and columns: ebacgw's SQL; column order from its own insert
  #   INSERT INTO Object VALUES(type, instance, property, idx, encoding,
  #   value), e.g. (8, <device>, 531, 1, 2, '47808'); encoding = BACnet
  #   application tag (2 unsigned, 7 character string);
  # - the gateway's Device object (type 8), instance 123456 = <bacnet_id>
  #   of the factory cfg/restore/conf.xml.def;
  # - the four properties ebacgw requires before it serves (exit -4..-7):
  #   120 vendor-identifier (582, the value ebacgw writes itself),
  #   514 web service port (1234: bacclient calls 127.0.0.1:1234),
  #   515 adapter web service (127.0.0.1:1235: bacclient binds 1235),
  #   516 adapter process (only checked for presence).
  # Everything else (Device name, versions, the plant objects from
  # BACnetTemplates.xml) ebacgw and bacclient write at runtime.
  sqlite:
    /home/bticino/cfg/extra/50/master.sqlite: |
      CREATE TABLE Object (type INTEGER, instance INTEGER, property INTEGER,
                           idx INTEGER, encoding INTEGER, value TEXT);
      CREATE TABLE RemoteObjects (device INTEGER, type INTEGER,
                                  instance INTEGER, name TEXT);
      CREATE TABLE remotenetworks (network INTEGER, device INTEGER, mac TEXT);
      CREATE TABLE routers (net INTEGER, mac TEXT);
      INSERT INTO Object VALUES (8, 123456, 120, 1, 2, '582');
      INSERT INTO Object VALUES (8, 123456, 514, 1, 2, '1234');
      INSERT INTO Object VALUES (8, 123456, 515, 1, 7, '127.0.0.1:1235');
      INSERT INTO Object VALUES (8, 123456, 516, 1, 7, 'bacclient');
  devices:
    /dev/ttyS1: pty
  stack_config: home/bticino/cfg/stack_open.xml
  kernel_release: "2.6.32"

boundary:
  status: discovered
  bus: pty
  own: full
  # Note: F450 runs bacclient as p0 (OpenWebNet daemon) instead of openserver.
  # bacclient reaches the BACnet side through ebacgw's SOAP service on
  # 127.0.0.1:1234 and serves its own on 1235. Both run as firmware, on the
  # plant database above (findings/F450/bacnet-plant-database.md); the
  # harness's SOAP mock is no longer used for this target.
