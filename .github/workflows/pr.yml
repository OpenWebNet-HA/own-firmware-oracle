# Runs on every PR, forks included: no secrets, no firmware -- lint + guard +
# unit tests on synthetic fixtures. Actions are pinned to full commit SHAs.
name: pr
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A new push to a PR supersedes the run on its previous commit; main always
# finishes.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    # Pinned, not ubuntu-latest: see the note at the top of oracle.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # ruff / zizmor pinned: a new release can switch on rules and fail CI
      # unprompted
      - run: pip install pyyaml ruff==0.16.7 zizmor==1.30.1 pytest
      - name: lint
        run: ruff check tools tests
      # Enforces what oracle.yml's header promises: SHA-pinned actions, no
      # ${{ }} expansion inside run scripts, no credentials left in .git/config.
      - name: workflow audit (zizmor)
        run: zizmor --offline .github/workflows
      - name: guard (no binaries committed)
        run: python tools/guard.py
      - name: unit tests (synthetic fixtures only)
        run: pytest -q tests
